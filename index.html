<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chatApp Signin</title>
    <link rel="stylesheet" href="chatApp_home.css">
</head>

<body>
    <!-- This is a chatApp_signinPG -->
    <main class="card">
        <h1>Sign in</h1>
        <p class="subtitle">Welcome back. Please enter your details.</p>

        <form id="signin-form">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="row">
                <span></span>
                <a href="#" class="forgot" id="forgot">Forgot password?</a>
            </div>

            <p id="error" style="color:#dc2626; min-height:1.2em;"></p>

            <button type="submit" id="submit-btn" class="btn">Sign in</button>
        </form>

        <p class="footer">Don't have an account? <a href="chatApp_signupPG.html">Sign up</a></p>
    </main>
    <script type="module" src="chatApp_signin.js"></script>
</body>

</html>
